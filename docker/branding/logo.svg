<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="InvenTree Location">
  <title>InvenTree Location</title>
  <defs>
    <linearGradient id="marque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Une caisse vue de trois quarts : ce qui part, et ce qui revient. -->
  <path d="M32 6 L56 18 V46 L32 58 L8 46 V18 Z" fill="url(#marque)"/>
  <path d="M32 6 L56 18 L32 30 L8 18 Z" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M32 30 V58" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- La flèche du retour, qui distingue la location de la vente. -->
  <path d="M22 40 a10 10 0 0 0 18 5" fill="none" stroke="#ffffff" stroke-opacity="0.9"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M40 38 v7 h-7" fill="none" stroke="#ffffff" stroke-opacity="0.9"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

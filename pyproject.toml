#This file is used to package the InvenTreeLocation plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.17.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "setuptools_scm>=8", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-location"
description = "Module de gestion des locations événementielles pour InvenTree"
dynamic = ["version"]
authors = [
    { name = "groupe-6",email = "rokibtadjou17@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    # Validation de la photo d'un objet (`serializers.ImageField` ouvre le
    # fichier avec Pillow). InvenTree l'embarque déjà, mais le plugin s'en sert
    # directement : autant le déclarer plutôt que d'en dépendre par ricochet.
    "Pillow>=10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.optional-dependencies]
# Export PDF du rapport de retour (SCRUM-99). Tenu à l'écart des dépendances
# obligatoires : WeasyPrint tire des bibliothèques natives (pango, cairo)
# absentes de l'image. Sans lui, seul l'endpoint d'export répond 503.
pdf = [
    "weasyprint>=61",
]
test = [
    "pytest",
    "pytest-django",
    "responses>=0.23",
    "Django>=4.2,<6",
    "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/Kibouu945/inventree-location"

[project.entry-points."inventree_plugins"]
InvenTreeLocation = "inventree_location.core:InvenTreeLocation"

[tool.setuptools.packages.find]
where = [""]

# La version vient du tag git, pas d'une constante à tenir à jour : `git tag
# 1.2.0` suffit à livrer 1.2.0. Sur un commit non taggué, le numéro porte la
# distance au dernier tag et le hash — une version de développement se
# reconnaît sans avoir à demander.
[tool.setuptools_scm]
version_file = "inventree_location/_version.py"
# Sans `.git` — archive, image construite sans l'historique — on préfère un
# numéro manifestement faux à un build qui casse.
fallback_version = "0.0.0+sans-git"

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_location"]

[tool.pytest.ini_options]
testpaths = ["inventree_location", "tests"]
pythonpath = [".", "tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

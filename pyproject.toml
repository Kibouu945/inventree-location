#This file is used to package the InvenTreeLocation plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.17.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-location"
description = "Module de gestion des locations événementielles pour InvenTree"
dynamic = ["version"]
authors = [
    { name = "groupe-6",email = "rokibtadjou17@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.optional-dependencies]
# Export PDF du rapport de retour (SCRUM-99). Tenu à l'écart des dépendances
# obligatoires : WeasyPrint tire des bibliothèques natives (pango, cairo)
# absentes de l'image. Sans lui, seul l'endpoint d'export répond 503.
pdf = [
    "weasyprint>=61",
]
test = [
    "pytest",
    "pytest-django",
    "responses>=0.23",
    "Django>=4.2,<6",
    "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/Kibouu945/inventree-location"

[project.entry-points."inventree_plugins"]
InvenTreeLocation = "inventree_location.core:InvenTreeLocation"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "inventree_location.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_location"]

[tool.pytest.ini_options]
testpaths = ["inventree_location", "tests"]
pythonpath = [".", "tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

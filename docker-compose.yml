services:
  db:
    image: postgres:17
    container_name: inventree-location-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTREE_DB_NAME:-inventree}
      POSTGRES_USER: ${INVENTREE_DB_USER:-pguser}
      POSTGRES_PASSWORD: ${INVENTREE_DB_PASSWORD:-pgpassword}
    ports:
      - "${INVENTREE_DB_PORT_HOST:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTREE_DB_USER:-pguser} -d ${INVENTREE_DB_NAME:-inventree}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventree:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventree-location-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: ${INVENTREE_DB_NAME:-inventree}
      INVENTREE_DB_HOST: db
      INVENTREE_DB_PORT: "5432"
      INVENTREE_DB_USER: ${INVENTREE_DB_USER:-pguser}
      INVENTREE_DB_PASSWORD: ${INVENTREE_DB_PASSWORD:-pgpassword}
      INVENTREE_PLUGINS_ENABLED: "True"
      INVENTREE_PLUGIN_FILE: /home/inventree/data/plugins.txt
      INVENTREE_DEBUG: "True"
      INVENTREE_LOG_LEVEL: INFO
      # Fuseau métier (le calcul au jour doit être en heure locale, pas UTC).
      INVENTREE_TIMEZONE: Europe/Paris
      # Langue de l'interface. Sans elle, `LANGUAGE_CODE` retombe sur `en-us`
      # (InvenTree `settings.py` : `get_setting('INVENTREE_LANGUAGE', 'language',
      # 'en-us')`) : le shell est servi en anglais, Chrome conclut « page
      # anglaise » et traduit TOUTE la page — nos libellés déjà français
      # (« Annuler » → « Annuleur », « Enregistrer » → « Économiser ») et
      # jusqu'aux données saisies (« Zone émargement » affiché « Zone
      # d'émarrage »). Recette Tassin du 07/09/2026, remarques 3, 9 et 12.
      INVENTREE_LANGUAGE: fr
      # Page de connexion : image de fond, marque et mot d'accueil. C'est le
      # premier écran, et il ne nommait pas l'outil.
      #
      # Deux mécanismes, et non un : l'image et la marque se lisent dans leurs
      # propres variables, tandis que `INVENTREE_CUSTOMIZE` ne sert qu'au
      # message et au titre. Les poser dans le seul dictionnaire laissait
      # `CUSTOM_LOGO` à la chaîne « None » et l'écran gardait les visuels
      # d'InvenTree, sans rien signaler.
      #
      # Les chemins sont relatifs au statique collecté, alimenté par le
      # Dockerfile depuis `docker/branding/`.
      INVENTREE_CUSTOM_LOGO: location/logo.svg
      INVENTREE_CUSTOM_SPLASH: location/splash.svg
      INVENTREE_CUSTOMIZE: |-
        {"site_header": "InvenTree Location", "login_message": "<div style='display:flex;gap:.85rem;align-items:flex-start;line-height:1.45'><img src='/static/location/logo.svg' alt='' width='38' height='38' style='flex:none;margin-top:.1rem'/><div><div style='font-weight:700;font-size:1.02rem'>InvenTree Location</div><div style='opacity:.72;font-size:.85rem;margin-top:.15rem'>Mat\u00e9riel \u00e9v\u00e9nementiel \u2014 manifestations, bons de r\u00e9servation, livraisons, ramassages et retours.</div></div></div>"}
      INVENTREE_ADMIN_USER: ${INVENTREE_ADMIN_USER:-admin}
      INVENTREE_ADMIN_PASSWORD: ${INVENTREE_ADMIN_PASSWORD:-admin123}
      INVENTREE_ADMIN_EMAIL: ${INVENTREE_ADMIN_EMAIL:-admin@example.com}
      INVENTREE_AUTO_UPDATE: "True"
      INVENTREE_SITE_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/home/inventree/plugin
      - inventree_data:/home/inventree/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventree-location-worker
    restart: unless-stopped
    command: ["invoke", "worker"]
    depends_on:
      db:
        condition: service_healthy
      inventree:
        condition: service_started
    environment:
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: ${INVENTREE_DB_NAME:-inventree}
      INVENTREE_DB_HOST: db
      INVENTREE_DB_PORT: "5432"
      INVENTREE_DB_USER: ${INVENTREE_DB_USER:-pguser}
      INVENTREE_DB_PASSWORD: ${INVENTREE_DB_PASSWORD:-pgpassword}
      INVENTREE_PLUGINS_ENABLED: "True"
      INVENTREE_PLUGIN_FILE: /home/inventree/data/plugins.txt
      INVENTREE_AUTO_UPDATE: "True"
      INVENTREE_DEBUG: "True"
      INVENTREE_LOG_LEVEL: INFO
      # Même fuseau métier que le serveur.
      INVENTREE_TIMEZONE: Europe/Paris
      # Même langue que le serveur : le worker rend les rapports et les e-mails.
      INVENTREE_LANGUAGE: fr
    volumes:
      - .:/home/inventree/plugin
      - inventree_data:/home/inventree/data

  frontend:
    image: node:20-alpine
    container_name: inventree-location-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      - inventree
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/frontend/node_modules

volumes:
  db_data:
  inventree_data:
